[package]
name = "rustified-youtube"
version = "0.1.2"
description = "A Rust desktop companion for YouTube Music"
authors = ["zygerr"]
edition = "2021"
rust-version = "1.90"
publish = false

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
open = "5"
