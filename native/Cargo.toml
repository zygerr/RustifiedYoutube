[package]
name = "rustified-youtube-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "RustifiedYoutube"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1"

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "wgpu", "persistence", "accesskit"] }
wgpu = { version = "27", default-features = false, features = ["dx12", "wgsl"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
rustified-core = { path = "../crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
open = "5"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "process", "time", "net", "io-util", "macros"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
tray-icon = "0.25"
muda = "0.20"
single-instance = "0.3"
rand = "0.10"
wry = "0.57"
raw-window-handle = "0.6"
windows = { version = "0.62", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_Threading", "Win32_Media_Audio", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Diagnostics_ToolHelp"] }
