name: Windows build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
      - name: Validate version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $packages = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages
          $version = ($packages | Where-Object name -eq 'rustified-youtube-native').version
          if (!$version -or ($packages | Where-Object version -ne $version)) { throw 'Workspace versions disagree' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:RELEASE_TAG -ne "v$version") { throw 'Tag does not match the application version' }
          "APP_VERSION=$version" >> $env:GITHUB_ENV
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test native/tests/media_bridge.cjs
      - name: Build native client, helpers, and installer
        shell: pwsh
        run: ./scripts/build-native.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: RustifiedYoutube-windows-x64
          path: dist/${{ env.APP_VERSION }}/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: RustifiedYoutube-windows-x64
          path: dist
      - name: Create a draft release for review, or refresh an existing one
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --draft --title "RustifiedYoutube $RELEASE_TAG" --generate-notes
          fi
