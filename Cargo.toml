[workspace]
members = ["native", "auth-helper", "crates/core"]
default-members = ["native"]
resolver = "2"

[workspace.package]
version = "0.3.18"
edition = "2024"
rust-version = "1.90"
publish = false

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

# Keep local checks and previews from accumulating multi-gigabyte PDBs and
# incremental snapshots. Optimized shipped builds keep the release profile.
[profile.dev]
debug = 0
incremental = false
